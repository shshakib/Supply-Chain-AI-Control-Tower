name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Python quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run unit tests
        run: python -m pytest -m "not integration"

      - name: Smoke-test SQLite lifecycle
        run: |
          control-tower --database-url sqlite:///./ci-control-tower.db migrate
          control-tower --database-url sqlite:///./ci-control-tower.db seed --if-empty
          control-tower --database-url sqlite:///./ci-control-tower.db demo
          alembic -c alembic.ini -x database_url=sqlite:///./ci-control-tower.db check

  integrations:
    name: PostgreSQL, pgvector, and MCP integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: control_tower_test
          POSTGRES_USER: control_tower
          POSTGRES_PASSWORD: control_tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_tower -d control_tower_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://control_tower:control_tower@127.0.0.1:5432/control_tower_test
      TEST_RISK_MCP_URL: http://127.0.0.1:8010/mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Start external-risk MCP service
        run: |
          control-tower-risk-mcp --host 127.0.0.1 --port 8010 > risk-mcp.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8010/health

      - name: Run live integration tests
        run: python -m pytest -m integration

      - name: Show MCP log after failure
        if: failure()
        run: cat risk-mcp.log

  container:
    name: Full Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start complete stack
        run: docker compose up --detach --build

      - name: Verify web and MCP health
        run: |
          curl --fail --retry 60 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/api/health
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8010/health

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop complete stack
        if: always()
        run: docker compose down --volumes --remove-orphans

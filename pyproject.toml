[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-ai-control-tower"
version = "0.5.0"
description = "A deterministically authorized multi-agent supply-chain control tower"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2.25,<3",
  "openai-agents>=0.19.4,<1",
  "mcp>=1.29,<2",
  "SQLAlchemy>=2.0.36,<3",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
control-tower = "control_tower.cli:main"
control-tower-web = "control_tower.web:main"
control-tower-risk-mcp = "control_tower.integrations.risk_mcp_server:main"

[tool.setuptools.package-data]
control_tower = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

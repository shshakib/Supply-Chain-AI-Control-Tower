[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyscope"
version = "0.2.0"
description = "A synthetic multi-agent supply-chain intelligence portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2.25,<3",
  "openai-agents>=0.2,<1",
  "SQLAlchemy>=2.0.36,<3",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
supplyscope = "supplyscope.cli:main"
supplyscope-web = "supplyscope.web:main"

[tool.setuptools.package-data]
supplyscope = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

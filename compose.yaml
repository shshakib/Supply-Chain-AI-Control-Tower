name: supply-chain-ai-control-tower

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: control_tower
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: control_tower
    ports:
      - "${CONTROL_TOWER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - control_tower_postgres:/var/lib/postgresql/data

  migrate:
    image: supply-chain-ai-control-tower:local
    build:
      context: .
    command: ["control-tower", "migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://control_tower:control_tower@db:5432/control_tower
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: supply-chain-ai-control-tower:local
    build:
      context: .
    command: ["control-tower", "seed", "--if-empty"]
    environment:
      DATABASE_URL: postgresql+psycopg://control_tower:control_tower@db:5432/control_tower
      CONTROL_TOWER_DOCUMENT_DIR: /app/synthetic_documents
    depends_on:
      migrate:
        condition: service_completed_successfully

  risk-feed:
    image: supply-chain-ai-control-tower:local
    build:
      context: .
    command:
      - control-tower-risk-mcp
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      - "${CONTROL_TOWER_MCP_PORT:-8010}:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: supply-chain-ai-control-tower:local
    build:
      context: .
    command: ["control-tower-web", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://control_tower:control_tower@db:5432/control_tower
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTROL_TOWER_SUPERVISOR_MODEL: ${CONTROL_TOWER_SUPERVISOR_MODEL:-gpt-5.6-terra}
      CONTROL_TOWER_SPECIALIST_MODEL: ${CONTROL_TOWER_SPECIALIST_MODEL:-gpt-5.6-luna}
      CONTROL_TOWER_EMBEDDING_MODEL: ${CONTROL_TOWER_EMBEDDING_MODEL:-text-embedding-3-small}
      CONTROL_TOWER_EMBEDDING_DIMENSIONS: ${CONTROL_TOWER_EMBEDDING_DIMENSIONS:-384}
      CONTROL_TOWER_RISK_MCP_ENABLED: "true"
      CONTROL_TOWER_RISK_MCP_URL: http://risk-feed:8010/mcp
    ports:
      - "${CONTROL_TOWER_WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      seed:
        condition: service_completed_successfully
      risk-feed:
        condition: service_healthy
    restart: unless-stopped

volumes:
  control_tower_postgres:

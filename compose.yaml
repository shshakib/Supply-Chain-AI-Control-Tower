services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supplyscope
      POSTGRES_USER: supplyscope
      POSTGRES_PASSWORD: supplyscope
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyscope -d supplyscope"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - supplyscope_postgres:/var/lib/postgresql/data

volumes:
  supplyscope_postgres:

